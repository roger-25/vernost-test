apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdap-backend
  namespace: cdap-system
  labels:
    app: cdap-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cdap-backend
  template:
    metadata:
      labels:
        app: cdap-backend
    spec:
      containers:
      - name: backend
        image: cdap-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cdap-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cdap-backend-service
  namespace: cdap-system
spec:
  selector:
    app: cdap-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    name: http
  type: ClusterIP
