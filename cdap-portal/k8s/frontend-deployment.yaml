apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdap-frontend
  namespace: cdap-system
  labels:
    app: cdap-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cdap-frontend
  template:
    metadata:
      labels:
        app: cdap-frontend
    spec:
      containers:
      - name: frontend
        image: cdap-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cdap-frontend-service
  namespace: cdap-system
spec:
  selector:
    app: cdap-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http
  type: LoadBalancer
